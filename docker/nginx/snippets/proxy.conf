# ============================================================
#  /health/<应用>/ 转发到应用容器 /api/health 的公共参数
#  （被 docker/nginx/default.conf.template 里的 7 个 health location 复用）
#  超时给得比较短：面板要的是"在或不在"，不该让浏览器干等。
# ============================================================
proxy_http_version 1.1;
proxy_set_header Host $host;
proxy_connect_timeout 3s;
proxy_send_timeout 8s;
proxy_read_timeout 8s;